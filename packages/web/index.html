<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#050914" />
		<link rel="icon" href="/favicon-v5.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-v5-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-v5-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-v5-512.png" />
		<link rel="icon" type="image/svg+xml" href="/brand/icon-v5.svg" />
		<link rel="apple-touch-icon" href="/brand/apple-touch-v5.png" />
		<title>IMOVIX — Tecnologia e marketing imobiliário 3D</title>
		<meta
			name="description"
			content="A IMOVIX transforma projetos imobiliários em experiências digitais que vendem. Vídeos 3D, sites imersivos, plantas interativas e sistemas para construtoras, incorporadoras e imobiliárias."
		/>
		<link rel="canonical" href="https://imovi.site/" />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="pt_BR" />
		<meta property="og:site_name" content="IMOVIX" />
		<meta property="og:title" content="IMOVIX — Transformamos projetos imobiliários em experiências que vendem" />
		<meta
			property="og:description"
			content="Tecnologia, visualização 3D e estratégia para construtoras, incorporadoras e imobiliárias venderem e alugarem mais."
		/>
		<!-- ATENCAO: og:image, og:url e canonical precisam apontar para o dominio
				     que realmente serve o site. Se a producao sair de outro dominio que nao
				     imovi.site, troque as tres linhas abaixo — scrapers nao seguem redirect
				     nem resolvem caminho relativo, e o card de compartilhamento fica sem imagem. -->
		<meta property="og:url" content="https://imovi.site/" />
		<meta property="og:image" content="https://imovi.site/og-image-v5.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://imovi.site/og-image-v5.jpg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="preload" as="image" href="/video/hero-poster.jpg" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
